<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监管数据总览大屏</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2563eb"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#navGrad)"/>
        <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="11.5" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <rect x="9" y="18" width="14" height="10" rx="5" stroke="#eaf6ff" stroke-width="2.4"/>
        <rect x="19" y="18" width="14" height="10" rx="5" stroke="#eaf6ff" stroke-width="2.4"/>
        <circle cx="29.5" cy="31" r="5.5" stroke="#c9f6ff" stroke-width="2.2"/>
        <line x1="33.8" y1="35.3" x2="39" y2="40.5" stroke="#c9f6ff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-zh">VeriTrace ChainHawk</span>
      <span class="brand-sep"></span>
      <span class="brand-en">证溯·链鹰</span>
    </div>
    <div class="nav-right">
      <a href="admin-dashboard.html" class="nav-link active">总览大屏</a>
      <a href="admin-case.html" class="nav-link">案件溯源</a>
      <div class="dropdown">
        <button class="dropdown-toggle" onclick="toggleDropdown('adminMenu')">🏛️ <strong id="navName">-</strong><span class="arrow">▾</span></button>
        <div class="dropdown-panel" id="adminMenu">
          <a href="javascript:void(0)" onclick="logout()">退出登录</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-wide">
    <div class="page-title">监管数据总览大屏</div>
    <div class="page-sub">链上交易监控 · 风险态势感知 · 报案案件取证管理</div>

    <!-- 统计卡片（点击跳转对应详情页） -->
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-num" id="sUsers">-</div><div class="stat-label"></div></div>
      <a class="stat-card" href="admin-audit.html"><div class="stat-icon">🧾</div><div class="stat-num" id="sPending">-</div><div class="stat-label">待审核报案</div></a>
      <a class="stat-card" href="admin-transaction.html"><div class="stat-icon">💸</div><div class="stat-num" id="sTx">-</div><div class="stat-label">全网交易笔数</div></a>
      <a class="stat-card" href="admin-risk.html"><div class="stat-icon">⚠️</div><div class="stat-num" id="sRiskTx">-</div><div class="stat-label">中/高风险交易</div></a>
      <a class="stat-card" href="admin-audit.html"><div class="stat-icon">🚫</div><div class="stat-num" id="sMalicious">-</div><div class="stat-label">恶意报案数</div></a>
      <a class="stat-card" href="admin-case.html"><div class="stat-icon">🔎</div><div class="stat-num" id="sTraced">-</div><div class="stat-label">已溯源案件数</div></a>
      <a class="stat-card" href="admin-case.html"><div class="stat-icon">📁</div><div class="stat-num" id="sCase">-</div><div class="stat-label">报案案件数</div></a>
      <a class="stat-card" href="admin-audit.html"><div class="stat-icon">✅</div><div class="stat-num" id="sApproved">-</div><div class="stat-label">已通过案件数</div></a>
    </div>

    <!-- 图表区 -->
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="card">
        <div class="card-title">链上交易风险等级分布</div>
        <div class="chart-box" id="chartRisk"></div>
      </div>
      <div class="card">
        <div class="card-title">报案案件状态分布</div>
        <div class="chart-box" id="chartCase"></div>
      </div>
      <div class="card">
        <div class="card-title">最新链上交易（实时滚动）</div>
        <div class="table-wrap" style="max-height:300px; overflow:auto;">
          <table>
            <thead><tr><th>交易ID</th><th>转出</th><th>接收</th><th>金额(ETH)</th><th>风险</th><th>时间</th></tr></thead>
            <tbody id="recentTxBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">最新报案案件</div>
        <div class="table-wrap" style="max-height:300px; overflow:auto;">
          <table>
            <thead><tr><th>案件编号</th><th>报案人</th><th>涉案金额(ETH)</th><th>状态</th><th>报案时间</th></tr></thead>
            <tbody id="recentCaseBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/charts.js"></script>
  <script>
    (function () {
      if (!guardAdmin()) return;
      document.getElementById("navName").textContent = shortAddr(getUser().address, 4) || "-";
      loadStats();

      async function loadStats() {
        const res = await api("/admin/stats");
        if (!res.ok) { toast(res.msg, "error"); return; }
        const s = res.stats;
        document.getElementById("sPending").textContent = s.submittedCount;
        document.getElementById("sTx").textContent = s.txCount;
        document.getElementById("sRiskTx").textContent = (s.riskLevelDist[2] || 0) + (s.riskLevelDist[3] || 0);
        document.getElementById("sMalicious").textContent = s.maliciousCount;
        document.getElementById("sTraced").textContent = s.tracedCount;
        document.getElementById("sCase").textContent = s.caseCount;
        document.getElementById("sApproved").textContent = s.approvedCount;
        drawRiskDist(document.getElementById("chartRisk"), s.riskDist);
        drawCaseStatus(document.getElementById("chartCase"), s.caseStatusDist);
        renderRecentTx(s);
        renderRecentCases(s);
      }

      function renderRecentTx(s) {
        const list = s.recentTxs || [];
        document.getElementById("recentTxBody").innerHTML = list.length ? list.map(t => `
          <tr>
            <td class="mono">#${t.txId}</td>
            <td class="mono">${shortAddr(t.sender)}</td>
            <td class="mono">${shortAddr(t.receiver)}</td>
            <td class="mono">${t.amountEth}</td>
            <td>${riskBadge(t.riskLevel, t.riskText)}</td>
            <td class="muted">${new Date(t.timestamp * 1000).toLocaleString()}</td>
          </tr>`).join("") : `<tr><td colspan="6" class="empty">暂无交易</td></tr>`;
      }

      function renderRecentCases(s) {
        const list = s.recentCases || [];
        document.getElementById("recentCaseBody").innerHTML = list.length ? list.map(c => `
          <tr>
            <td class="mono">${c.caseNo}</td>
            <td class="mono">${shortAddr(c.reporterAddr)}</td>
            <td class="mono">${c.amountEth || "—"}</td>
            <td>${caseBadge(c.status)}</td>
            <td class="muted">${(c.createdAt || "").slice ? c.createdAt : "—"}</td>
          </tr>`).join("") : `<tr><td colspan="5" class="empty">暂无报案案件</td></tr>`;
      }
    })();
  </script>
</body>
</html>
