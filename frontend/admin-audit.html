<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报案案件审核</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2563eb"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#navGrad)"/>
        <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="11.5" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <rect x="9" y="18" width="14" height="10" rx="5" stroke="#eaf6ff" stroke-width="2.4"/>
        <rect x="19" y="18" width="14" height="10" rx="5" stroke="#eaf6ff" stroke-width="2.4"/>
        <circle cx="29.5" cy="31" r="5.5" stroke="#c9f6ff" stroke-width="2.2"/>
        <line x1="33.8" y1="35.3" x2="39" y2="40.5" stroke="#c9f6ff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-zh">VeriTrace ChainHawk</span>
      <span class="brand-sep"></span>
      <span class="brand-en">证溯·链鹰</span>
    </div>
    <div class="nav-right">
      <a href="admin-dashboard.html" class="nav-link">总览大屏</a>
      <a href="admin-case.html" class="nav-link">案件溯源</a>
      <div class="dropdown">
        <button class="dropdown-toggle" onclick="toggleDropdown('adminMenu')">🏛️ <strong id="navName">-</strong><span class="arrow">▾</span></button>
        <div class="dropdown-panel" id="adminMenu">
          <a href="javascript:void(0)" onclick="logout()">退出登录</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-wide">
    <div class="flex-between">
      <div>
        <div class="page-title">报案案件审核</div>
        <div class="page-sub">系统自动比对链上原始交易签名与报案提交的签名：一致则通过，不一致驳回并标记为恶意报案</div>
      </div>
      <div class="flex">
        <button class="btn btn-sm btn-ghost" onclick="loadCases()">刷新列表</button>
        <span class="badge badge-blue" id="pendingCount">-</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">全部报案案件</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>案件编号</th><th>报案人钱包</th><th>涉案交易</th><th>涉案金额(ETH)</th><th>状态</th><th>签名比对</th><th>报案时间</th><th>操作</th></tr>
          </thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 案件详情弹窗 -->
  <div class="modal-mask" id="detailModal">
    <div class="modal" style="max-width:860px;">
      <h3 id="detailTitle">案件审核详情</h3>
      <div id="detailBody">加载中...</div>
      <div class="text-right mt-16">
        <button class="btn btn-ghost" onclick="document.getElementById('detailModal').classList.remove('show')">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    (function () {
      if (!guardAdmin()) return;
      document.getElementById("navName").textContent = shortAddr(getUser().address, 4) || "-";
      loadCases();

      async function loadCases() {
        const res = await api("/report/all");
        if (!res.ok) { toast(res.msg, "error"); return; }
        const cases = res.cases || [];
        document.getElementById("pendingCount").textContent = "待审核 " + cases.filter(c => c.status === "submitted").length + " 件";
        document.getElementById("auditBody").innerHTML = cases.length ? cases.map(c => `
          <tr>
            <td class="mono">${c.caseNo}</td>
            <td class="mono">${shortAddr(c.reporterAddr)}</td>
            <td class="mono">#${c.txId || "—"}</td>
            <td class="mono">${c.amountEth || "—"}</td>
            <td>${caseBadge(c.status)}</td>
            <td>${sigBadge(c)}</td>
            <td class="muted">${c.createdAt || "—"}</td>
            <td>
              <button class="btn btn-sm btn-ghost" onclick="showDetail(${c.id})">详情</button>
              ${c.status === "submitted"
                ? `<button class="btn btn-success btn-sm" onclick="audit(${c.id}, 'approve')">通过</button>
                   <button class="btn btn-danger btn-sm" onclick="audit(${c.id}, 'reject')">驳回</button>`
                : ""}
            </td>
          </tr>`).join("") : `<tr><td colspan="8" class="empty">暂无报案案件</td></tr>`;
      }

      function sigBadge(c) {
        if (c.signatureMatch == null) return `<span class="badge badge-dim">未比对</span>`;
        return c.signatureMatch === 1
          ? `<span class="badge badge-green">一致</span>`
          : `<span class="badge badge-3">不一致</span>`;
      }

      async function showDetail(caseId) {
        document.getElementById("detailModal").classList.add("show");
        document.getElementById("detailTitle").textContent = "案件审核详情";
        document.getElementById("detailBody").innerHTML = "加载中...";
        const res = await api("/report/detail?caseId=" + caseId);
        const b = document.getElementById("detailBody");
        if (!res.ok) { b.innerHTML = `<div class="muted">${res.msg}</div>`; return; }
        const c = res.case;
        const sigMatch = res.signatureMatch;
        b.innerHTML = `
          <div class="grid grid-3" style="margin-bottom:14px;">
            <div class="stat-card"><div class="stat-label">案件状态</div><div class="stat-num" style="font-size:18px;">${caseBadge(c.status)}</div></div>
            <div class="stat-card"><div class="stat-label">签名比对</div><div class="stat-num" style="font-size:18px;">${sigBadge(c)}</div></div>
            <div class="stat-card"><div class="stat-label">链上证据核验</div><div class="stat-num" style="font-size:16px;">${res.evidenceVerified ? '<span class="badge badge-green">一致</span>' : '<span class="badge badge-dim">未核验</span>'}</div></div>
          </div>
          <div class="card-title">案件信息</div>
          <table>
            <tr><td class="muted" style="width:130px;">案件编号</td><td class="mono">${c.caseNo}</td></tr>
            <tr><td class="muted">报案人钱包</td><td class="mono">${c.reporterAddr}</td></tr>
            <tr><td class="muted">涉案链上交易</td><td class="mono">#${c.txId || "—"}</td></tr>
            <tr><td class="muted">涉案金额</td><td class="mono">${c.amountEth || "—"} ETH</td></tr>
            <tr><td class="muted">报案描述</td><td>${c.caseDesc || "—"}</td></tr>
            <tr><td class="muted">报案时间</td><td>${c.createdAt || "—"}</td></tr>
          </table>
          <div class="card-title mt-16">签名比对详情（报案审核核心）</div>
          <table>
            <tr><td class="muted" style="width:130px;">链上原始交易签名</td><td class="mono" style="word-break:break-all;">${res.onChainTx ? shortHash(res.onChainTx.signature, 40) : "链上未找到"}</td></tr>
            <tr><td class="muted">报案提交的交易签名</td><td class="mono" style="word-break:break-all;">${shortHash(c.txSignature || "", 40) || "—"}</td></tr>
            <tr><td class="muted">比对结果</td><td>${sigMatch == null ? '<span class="badge badge-dim">未审核</span>' : sigMatch ? '<span class="badge badge-green">签名一致，可审核通过</span>' : '<span class="badge badge-3">签名不一致，应驳回并标记恶意报案</span>'}</td></tr>
            ${c.auditRemark ? `<tr><td class="muted">审核意见</td><td>${c.auditRemark}</td></tr>` : ""}
          </table>`;
      }

      async function audit(caseId, action) {
        const remark = action === "reject" ? (prompt("请输入驳回原因（将标记为恶意报案）：") || "") : "";
        if (!confirm(action === "approve" ? "系统将比对链上交易签名与报案签名，确认审核？" : "驳回后该报案将标记为恶意报案，确认？")) return;
        const res = await api("/report/audit", { method: "POST", body: { caseId, remark } });
        if (res.ok) { toast(res.msg, res.status === "approved" ? "success" : "warn", 4000); loadCases(); }
        else toast(res.msg, "error");
      }
      window.loadCases = loadCases;
      window.showDetail = showDetail;
      window.audit = audit;
    })();
  </script>
</body>
</html>
